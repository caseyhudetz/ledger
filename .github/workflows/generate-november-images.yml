name: Generate November Ledger article images
on:
  push:
    branches:
      - ledger-fix-november-images
    paths:
      - '.github/workflows/generate-november-images.yml'
      - 'scripts/build_november_photos.py'
      - 'site/November.png'
permissions:
  contents: write
jobs:
  crop-photographs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install 'Pillow>=11,<13'
      - name: Crop November newspaper photographs
        run: python scripts/build_november_photos.py
      - name: Commit new images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/november-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add cropped November article images"
            git push
          fi
