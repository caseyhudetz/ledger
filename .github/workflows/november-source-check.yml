name: Probe November print asset source
on:
  push:
    branches: [ledger-publish-november]
    paths: ['.github/workflows/november-source-check.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Canva source access
        env:
          URL0: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7cf157b9-1088-4580-b57f-382594e1037d/watermark:F/width:152?csig=AAAAAAAAAAAAAAAAAAAAAKqomBnqqZHOVPWzA7KBh3bg3FI_Hob7tcedbtI3nmh1&exp=1795055267&osig=AAAAAAAAAAAAAAAAAAAAAKhhEYfnfCnZEjhgP6llAYCdc8EMgehTWES1B0otML5o&signer=media-rpc&token=AAIAAU0AJDdjZjE1N2I5LTEwODgtNDU4MC1iNTdmLTM4MjU5NGUxMDM3ZAAAAAABofGhrLhe5XGRH03eyAgIGql7kgMhCk_djhxbvB53nXy-_EO8EA&x-canva-quality=thumbnail"
          URL1: "https://media.canva.com/v2/image-resize/format:PNG/height:2000/quality:100/uri:ifs%3A%2F%2FM%2F7cf157b9-1088-4580-b57f-382594e1037d/watermark:F/width:1521?csig=AAAAAAAAAAAAAAAAAAAAAKqomBnqqZHOVPWzA7KBh3bg3FI_Hob7tcedbtI3nmh1&exp=1795055267&osig=AAAAAAAAAAAAAAAAAAAAAKhhEYfnfCnZEjhgP6llAYCdc8EMgehTWES1B0otML5o&signer=media-rpc&token=AAIAAU0AJDdjZjE1N2I5LTEwODgtNDU4MC1iNTdmLTM4MjU5NGUxMDM3ZAAAAAABofGhrLhe5XGRH03eyAgIGql7kgMhCk_djhxbvB53nXy-_EO8EA&x-canva-quality=thumbnail"
          URL2: "https://www.canva.com/d/2KWPt1aYlkZc_OK"
          URL3: "https://www.canva.com/design/DAHWISQJQjU/view?embed"
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          for i,label in enumerate(["thumb","upscaled","view","embed"]):
              u=os.environ['URL'+str(i)]
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/png,image/*,*/*;q=0.8'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      b=response.read(100)
                      print(label, response.status, response.headers.get('Content-Type'), response.headers.get('Content-Length'), repr(b[:30]))
              except Exception as ex:
                  print(label, type(ex).__name__,str(ex)[:240])
          PY
