name: Generate Ledger favicons
on:
  push:
    branches:
      - ledger-mobile-reading-favicon
      - main
    paths:
      - ".github/workflows/generate-site-icons.yml"
      - "scripts/generate_site_icons.py"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Generate favicon assets
        run: python scripts/generate_site_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/favicon-32.png site/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Ledger favicon PNG assets"
            git push
          fi
